name: three.js lokal ablegen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: three.js r128 ins Repository legen (nur falls noch nicht vorhanden)
        run: |
          if [ -f vendor/three.min.js ] && [ -f vendor/OrbitControls.js ]; then
            echo "three.js liegt bereits lokal vor."
            exit 0
          fi
          mkdir -p vendor tmp
          curl -sSL https://registry.npmjs.org/three/-/three-0.128.0.tgz -o tmp/three.tgz
          tar xzf tmp/three.tgz -C tmp
          cp tmp/package/build/three.min.js vendor/
          cp tmp/package/examples/js/controls/OrbitControls.js vendor/
          cp tmp/package/LICENSE vendor/THREE-LICENSE.txt
          rm -rf tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          git commit -m "three.js r128 lokal abgelegt (kein externes CDN mehr nötig)"
          git push
